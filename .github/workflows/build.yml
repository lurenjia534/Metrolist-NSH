name: Build Metrolist NSH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android universal APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ../toolchain/downloads
            ../toolchain/android-sdk
            ../toolchain/media3
            ../toolchain/nsh-android-source
          key: android-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json', 'android/media3-dependencies.json', 'scripts/build-android.py') }}
      - name: Install matching NSH CLI and Android runtime
        run: |
          python3 scripts/install-nsh.py --component android
          echo "$(realpath ../toolchain/nsh/bin)" >> "$GITHUB_PATH"
      - name: Prepare optional persistent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ../toolchain/signing
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ../toolchain/signing/metrolist-release.jks
            printf '%s' "$KEYSTORE_PASSWORD" > ../toolchain/signing/metrolist-password
          fi
      - name: Build Android host, media service and APK
        run: |
          NSH_BIN="$(command -v nsh)" python3 scripts/build-android.py --sdk ../toolchain/android-sdk --out releases/android
      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-android-universal
          path: releases/android/
          if-no-files-found: error

  native:
    name: ${{ matrix.target }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: actions/cache@v4
        with:
          path: ../toolchain/downloads
          key: nsh-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nsh-toolchain.json') }}
      - name: Install matching NSH CLI
        shell: bash
        run: |
          python scripts/install-nsh.py
          python -c "from pathlib import Path; print(Path('../toolchain/nsh/bin').resolve())" >> "$GITHUB_PATH"
      - name: Type check
        run: nsh check
      - name: Shared state tests
        run: nsh test
      - name: Build native package
        run: nsh package --target ${{ matrix.target }} --out dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-${{ matrix.target }}
          path: dist/native/
          if-no-files-found: error

  web:
    name: Web bundle and local gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ../toolchain/downloads
          key: nsh-web-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json') }}
      - name: Install matching NSH CLI and web runtime
        run: |
          python3 scripts/install-nsh.py --component web
          echo "$(realpath ../toolchain/nsh/bin)" >> "$GITHUB_PATH"
      - name: Gateway tests
        run: node --test server/*.test.mjs
      - name: Build web app
        run: npm run build
      - name: Assemble local server distribution
        run: |
          mkdir -p dist/local/server dist/local/dist
          cp -R dist/client dist/local/dist/client
          cp server/*.mjs server/requirements.txt dist/local/server/
          cp COPYING NOTICE.md README.md dist/local/
      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-web-local-gateway
          path: dist/local/
          if-no-files-found: error
