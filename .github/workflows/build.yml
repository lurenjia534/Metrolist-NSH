name: Build Metrolist NSH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android universal APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install NSH nightly
        run: |
          sh scripts/install-nsh.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prepare optional persistent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ../toolchain/signing
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ../toolchain/signing/metrolist-release.jks
            printf '%s' "$KEYSTORE_PASSWORD" > ../toolchain/signing/metrolist-password
          fi
      - name: Build Android host, media service and APK
        run: |
          NSH_BIN="$(command -v nsh)" python3 scripts/build-android.py --sdk ../toolchain/android-sdk --out releases/android
      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-android-universal
          path: releases/android/
          if-no-files-found: error

  native:
    name: ${{ matrix.target }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Install NSH nightly on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/install-nsh.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install NSH nightly on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'nightly'
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Type check
        run: nsh check
      - name: Shared state tests
        run: nsh test
      - name: Build native package
        run: nsh package --target ${{ matrix.target }} --out dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-${{ matrix.target }}
          path: dist/native/
          if-no-files-found: error

  web:
    name: Web bundle and local gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install NSH nightly
        run: |
          sh scripts/install-nsh.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build web app
        run: npm run build
      - name: Assemble local server distribution
        run: |
          mkdir -p dist/local/server dist/local/dist
          cp -R dist/client dist/local/dist/client
          cp server/*.mjs server/requirements.txt dist/local/server/
          cp COPYING NOTICE.md README.md dist/local/
      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-web-local-gateway
          path: dist/local/
          if-no-files-found: error
