name: Build and release Metrolist NSH

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or update this version's GitHub Release after building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metrolist-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      android_signing: ${{ steps.config.outputs.android_signing }}
      ios_signing: ${{ steps.config.outputs.ios_signing }}
      publish: ${{ steps.config.outputs.publish }}
    steps:
      - id: config
        name: Resolve release and signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          REQUEST_PUBLISH: ${{ inputs.publish_release }}
        run: |
          python3 - <<'PY'
          import os
          android = all(os.environ.get(k) for k in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD'))
          ios = all(os.environ.get(k) for k in ('IOS_CERTIFICATE_P12_BASE64', 'IOS_CERTIFICATE_PASSWORD', 'IOS_PROVISION_PROFILE_BASE64', 'IOS_SIGNING_IDENTITY'))
          event = os.environ['GITHUB_EVENT_NAME']
          ref = os.environ['GITHUB_REF']
          publish = (event == 'push' and (ref == 'refs/heads/main' or ref.startswith('refs/tags/v'))) or (event == 'workflow_dispatch' and ref == 'refs/heads/main' and os.environ.get('REQUEST_PUBLISH') == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'android_signing={str(android).lower()}\nios_signing={str(ios).lower()}\npublish={str(publish).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Android: existing preview signing configured.\n' if android else 'Android release is pending the existing preview signing secrets; other platforms continue. No replacement key will be generated.\n')
              output.write('iOS: optional provisioned IPA enabled.\n' if ios else 'iOS: simulator and explicitly unsigned device artifacts will be built.\n')
          PY

  verify:
    name: Shared application and gateway tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ../toolchain/downloads
            ../toolchain/nsh-cache
          key: nsh-verify-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json') }}
      - run: python scripts/install-nsh.py
      - run: npm run check
      - run: npm test
      - run: node --test server/*.test.mjs

  android:
    name: Android preview upgrades
    needs: [config, verify]
    if: needs.config.outputs.android_signing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ../toolchain/downloads
            ../toolchain/android-sdk
            ../toolchain/media3
            ../toolchain/nsh-android-source
          key: android-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json', 'android/media3-dependencies.json', 'scripts/build-android.py') }}
      - run: python scripts/install-nsh.py --component android
      - name: Build and verify both APKs with the existing preview identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python scripts/release.py android
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  native:
    name: Desktop ${{ matrix.target }} ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: windows-2025
            target: windows
            arch: x64
          - os: macos-15
            target: macos
            arch: arm64
          - os: macos-15-intel
            target: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: actions/cache@v4
        with:
          path: |
            ../toolchain/downloads
            ../toolchain/node-downloads
          key: desktop-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/nsh-toolchain.json', 'scripts/node-toolchain.json') }}
      - run: python scripts/install-nsh.py
      - name: Build app, bundled Node and gateway; smoke-test the packaged gateway
        run: python scripts/package-portable.py ${{ matrix.target }} --arch ${{ matrix.arch }} --out dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  ios:
    name: iOS ARM64 simulator and device
    needs: [config, verify]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ../toolchain/downloads
          key: ios-arm64-${{ hashFiles('scripts/nsh-toolchain.json') }}
      - run: python scripts/install-nsh.py --component ios
      - name: Build simulator and explicitly unsigned device archives
        run: python scripts/build-ios.py
      - name: Install and launch the actual simulator app
        run: python scripts/smoke-ios.py
      - name: Prepare optional Apple signing identity
        if: needs.config.outputs.ios_signing == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: python scripts/release.py apple-prepare
      - name: Build optional provisioned IPA
        if: needs.config.outputs.ios_signing == 'true'
        env:
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: python scripts/build-ios.py --signed-only
      - name: Remove temporary Apple signing keychain
        if: always() && env.IOS_KEYCHAIN_PATH != ''
        run: security delete-keychain "$IOS_KEYCHAIN_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-ios
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  web:
    name: Web site distribution
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ../toolchain/downloads
          key: nsh-web-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json') }}
      - run: python scripts/install-nsh.py --component web
      - run: npm run build
      - run: python scripts/package-portable.py web --out dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish versioned assets and checksums
    needs: [config, verify, android, native, ios, web]
    if: always() && needs.config.outputs.publish == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: .nsh/release-inputs
          merge-multiple: true
      - name: Collect actual artifacts, source archive, manifest and SHA-256 list
        env:
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/release.py collect --inputs .nsh/release-inputs
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/release.py publish
      - uses: actions/upload-artifact@v4
        with:
          name: final-release-files
          path: dist/release/
          if-no-files-found: error
          overwrite: true
