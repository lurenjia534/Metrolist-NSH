name: Build and release Metrolist NSH

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or update this version's GitHub Release after building
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTUP_TOOLCHAIN: "1.99.1"

concurrency:
  group: metrolist-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      android_signing: ${{ steps.config.outputs.android_signing }}
      ios_signing: ${{ steps.config.outputs.ios_signing }}
      publish: ${{ steps.config.outputs.publish }}
    steps:
      - id: config
        name: Resolve release and signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          REQUEST_PUBLISH: ${{ inputs.publish_release }}
        run: |
          python3 - <<'PY'
          import os
          android = all(os.environ.get(k) for k in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD'))
          ios = all(os.environ.get(k) for k in ('IOS_CERTIFICATE_P12_BASE64', 'IOS_CERTIFICATE_PASSWORD', 'IOS_PROVISION_PROFILE_BASE64', 'IOS_SIGNING_IDENTITY'))
          event = os.environ['GITHUB_EVENT_NAME']
          ref = os.environ['GITHUB_REF']
          publish = (event == 'push' and (ref == 'refs/heads/main' or ref.startswith('refs/tags/v'))) or (event == 'workflow_dispatch' and ref == 'refs/heads/main' and os.environ.get('REQUEST_PUBLISH') == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'android_signing={str(android).lower()}\nios_signing={str(ios).lower()}\npublish={str(publish).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Android: existing preview signing configured.\n' if android else 'Android release is pending the existing preview signing secrets; other platforms continue. No replacement key will be generated.\n')
              output.write('iOS: optional provisioned IPA enabled.\n' if ios else 'iOS: simulator and explicitly unsigned device artifacts will be built.\n')
          PY

  verify:
    name: Native application, Rust host and shared API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the absolute toolchain cache path
        run: python -c "import os; from pathlib import Path; root = (Path.cwd().parent / 'toolchain').resolve(); Path(os.environ['GITHUB_ENV']).open('a').write('METROLIST_TOOLCHAIN=' + root.as_posix() + '\nCARGO_TARGET_DIR=' + (root / 'cargo-target').as_posix() + '\n')"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.METROLIST_TOOLCHAIN }}/downloads
            ${{ env.METROLIST_TOOLCHAIN }}/nsh-cache
            ${{ env.METROLIST_TOOLCHAIN }}/cargo-target
            ~/.cargo/registry
            ~/.cargo/git
          key: nsh-verify-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json', 'native/Cargo.toml', 'native/Cargo.lock') }}
      - run: python scripts/install-nsh.py
      - name: Verify the Spotify browser bridge and generated bundle source
        run: |
          node --check src/spotish/bridge/bridge.js
          node --test src/spotish/bridge/tests/bridge.test.mjs
          node src/spotish/bridge/gen-source.mjs --check
      - run: python scripts/run-nsh.py check
      - run: python scripts/run-nsh.py build
      - run: python scripts/run-nsh.py test --web-host tests/native-login/host.js
      - name: Verify native Spotify subscriptions across workspace remounts
        env:
          SPOTISH_DEMO: '1'
        run: python scripts/run-nsh.py test tests/spotify-native.test.tsx
      - run: node --test server/*.test.mjs

  toolchain:
    name: Preserve the fixed NSH build inputs
    needs: [config, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the absolute toolchain cache path
        run: python -c "import os; from pathlib import Path; root = (Path.cwd().parent / 'toolchain').resolve(); Path(os.environ['GITHUB_ENV']).open('a').write('METROLIST_TOOLCHAIN=' + root.as_posix() + '\nCARGO_TARGET_DIR=' + (root / 'cargo-target').as_posix() + '\n')"
      - uses: actions/cache@v4
        with:
          path: ${{ env.METROLIST_TOOLCHAIN }}/downloads
          key: nsh-mirror-${{ hashFiles('scripts/nsh-toolchain.json') }}
      - name: Verify and stage every locked runtime and its source
        run: python scripts/mirror-nsh.py
      - name: Publish the fixed dependency prerelease before app builds
        if: needs.config.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/mirror-nsh.py --publish-only
      - uses: actions/upload-artifact@v4
        with:
          name: nsh-runtime-f4d68f7-manifest
          path: |
            dist/toolchain/NSH-MIRROR-MANIFEST.json
            dist/toolchain/SHA256SUMS.txt
            dist/toolchain/LICENSE-APACHE.txt
            dist/toolchain/NSH-PINNED-RUNTIME.md
            dist/toolchain/nsh-toolchain.json
          if-no-files-found: error
          overwrite: true

  android:
    name: Android preview upgrades
    needs: [config, verify, toolchain]
    if: needs.config.outputs.android_signing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Select the installed Android NDK
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          versions = sorted((Path(os.environ["ANDROID_HOME"]) / "ndk").iterdir(), key=lambda p: tuple(map(int, p.name.split("."))))
          with Path(os.environ["GITHUB_ENV"]).open("a") as out:
              out.write("ANDROID_NDK_HOME=" + str(versions[-1]) + "\n")
          PYTHON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the absolute toolchain cache path
        run: python -c "import os; from pathlib import Path; root = (Path.cwd().parent / 'toolchain').resolve(); Path(os.environ['GITHUB_ENV']).open('a').write('METROLIST_TOOLCHAIN=' + root.as_posix() + '\nCARGO_TARGET_DIR=' + (root / 'cargo-target').as_posix() + '\n')"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.METROLIST_TOOLCHAIN }}/downloads
            ${{ env.METROLIST_TOOLCHAIN }}/cargo-target
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.METROLIST_TOOLCHAIN }}/android-sdk
            ${{ env.METROLIST_TOOLCHAIN }}/media3
            ${{ env.METROLIST_TOOLCHAIN }}/nsh-android-source
          key: android-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json', 'android/media3-dependencies.json', 'scripts/build-android.py', 'native/Cargo.toml', 'native/Cargo.lock') }}
      - run: python scripts/install-nsh.py --component android
      - name: Build and verify both APKs with the existing preview identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python scripts/release.py android
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  native:
    name: Desktop ${{ matrix.target }} ${{ matrix.arch }}
    needs: [verify, toolchain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: windows-2025
            target: windows
            arch: x64
          - os: macos-15
            target: macos
            arch: arm64
          - os: macos-15-intel
            target: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Install native Linux libraries and display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav xvfb xauth x11-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the absolute toolchain cache path
        run: python -c "import os; from pathlib import Path; root = (Path.cwd().parent / 'toolchain').resolve(); Path(os.environ['GITHUB_ENV']).open('a').write('METROLIST_TOOLCHAIN=' + root.as_posix() + '\nCARGO_TARGET_DIR=' + (root / 'cargo-target').as_posix() + '\n')"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.METROLIST_TOOLCHAIN }}/downloads
            ${{ env.METROLIST_TOOLCHAIN }}/cargo-target
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/nsh-toolchain.json', 'native/Cargo.toml', 'native/Cargo.lock') }}
      - run: python scripts/install-nsh.py
      - name: Build the native app and verify its executable and package contents
        run: python scripts/package-portable.py ${{ matrix.target }} --arch ${{ matrix.arch }} --out dist/release
      - name: Launch the Linux application under Xvfb
        if: runner.os == 'Linux'
        # GTK portal/accessibility lookups need a session bus, as in the pinned NSH Linux CI.
        run: dbus-run-session -- xvfb-run -a python scripts/smoke-desktop.py linux --arch ${{ matrix.arch }}
      - name: Capture the native Spotify workspace and music lights
        if: runner.os == 'Linux'
        env:
          METROLIST_SPOTIFY_VISUAL: '1'
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1920x1200x24" python scripts/run-nsh.py test --target linux tests/spotify-visual.test.tsx
      - name: Launch the desktop application
        if: runner.os != 'Linux'
        run: python scripts/smoke-desktop.py ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/smoke/
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  ios:
    name: iOS ARM64 simulator and device
    needs: [config, verify, toolchain]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the absolute toolchain cache path
        run: python -c "import os; from pathlib import Path; root = (Path.cwd().parent / 'toolchain').resolve(); Path(os.environ['GITHUB_ENV']).open('a').write('METROLIST_TOOLCHAIN=' + root.as_posix() + '\nCARGO_TARGET_DIR=' + (root / 'cargo-target').as_posix() + '\n')"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.METROLIST_TOOLCHAIN }}/downloads
            ${{ env.METROLIST_TOOLCHAIN }}/cargo-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-arm64-${{ hashFiles('scripts/nsh-toolchain.json', 'native/Cargo.toml', 'native/Cargo.lock') }}
      - run: python scripts/install-nsh.py --component ios
      - name: Build simulator and explicitly unsigned device archives
        run: python scripts/build-ios.py
      - name: Install, launch, check process liveness and capture the simulator UI
        run: python scripts/smoke-ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-smoke
          path: dist/smoke/
          if-no-files-found: warn
          overwrite: true
      - name: Prepare optional Apple signing identity
        if: needs.config.outputs.ios_signing == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: python scripts/release.py apple-prepare
      - name: Build optional provisioned IPA
        if: needs.config.outputs.ios_signing == 'true'
        env:
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: python scripts/build-ios.py --signed-only
      - name: Remove temporary Apple signing keychain
        if: always() && env.IOS_KEYCHAIN_PATH != ''
        run: security delete-keychain "$IOS_KEYCHAIN_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-ios
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  web:
    name: Web site distribution
    needs: [verify, toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the absolute toolchain cache path
        run: python -c "import os; from pathlib import Path; root = (Path.cwd().parent / 'toolchain').resolve(); Path(os.environ['GITHUB_ENV']).open('a').write('METROLIST_TOOLCHAIN=' + root.as_posix() + '\nCARGO_TARGET_DIR=' + (root / 'cargo-target').as_posix() + '\n')"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.METROLIST_TOOLCHAIN }}/downloads
            ${{ env.METROLIST_TOOLCHAIN }}/cargo-target
            ~/.cargo/registry
            ~/.cargo/git
          key: nsh-web-${{ runner.os }}-${{ hashFiles('scripts/nsh-toolchain.json', 'native/Cargo.toml', 'native/Cargo.lock') }}
      - run: python scripts/install-nsh.py --component web
      - name: Generate the application Rust workspace and dependency lock
        run: python scripts/run-nsh.py build
      - name: Install the wasm-bindgen CLI matching the application runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib
          lock = tomllib.loads(Path('.nsh/rust/Cargo.lock').read_text())
          version = next(package['version'] for package in lock['package'] if package['name'] == 'wasm-bindgen')
          subprocess.run(['cargo', 'install', 'wasm-bindgen-cli', '--version', version, '--locked'], check=True)
          PY
      - run: npm run build
      - run: python scripts/package-portable.py web --out dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/release/
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish versioned assets and checksums
    needs: [config, verify, toolchain, android, native, ios, web]
    if: always() && needs.config.outputs.publish == 'true' && needs.verify.result == 'success' && needs.toolchain.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: .nsh/release-inputs
          merge-multiple: true
      - name: Collect actual artifacts, source archive, manifest and SHA-256 list
        env:
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/release.py collect --inputs .nsh/release-inputs
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/release.py publish
      - uses: actions/upload-artifact@v4
        with:
          name: final-release-files
          path: dist/release/
          if-no-files-found: error
          overwrite: true
